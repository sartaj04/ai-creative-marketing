<!DOCTYPE html>
<html>

<head>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .template-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;

            background: {
                    {
                    bg_color|default('#0f172a')
                }
            }

            ;
        }

        /* Decorative elements */
        .blob-1 {
            position: absolute;
            top: -100px;
            right: -100px;
            width: 400px;
            height: 400px;

            background: {
                    {
                    accent_color|default('#f97316')
                }
            }

            ;
            filter: blur(80px);
            opacity: 0.4;
            border-radius: 50%;
        }

        .blob-2 {
            position: absolute;
            bottom: -100px;
            left: -100px;
            width: 300px;
            height: 300px;

            background: {
                    {
                    secondary_color|default('#3b82f6')
                }
            }

            ;
            filter: blur(60px);
            opacity: 0.3;
            border-radius: 50%;
        }

        /* Content */
        .content {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 48px;
        }

        /* Logo */
        .logo {
            height: 48px;
            width: auto;
            object-fit: contain;
        }

        /* Main content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 24px;
        }

        /* Festival badge */
        .festival-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 100px;

            color: {
                    {
                    accent_color|default('#f97316')
                }
            }

            ;
            font-size: 16px;
            font-weight: 600;
        }

        .festival-emoji {
            font-size: 20px;
        }

        .headline {
            font-size: 52px;
            font-weight: 800;
            line-height: 1.15;
            color: #ffffff;
            max-width: 90%;
        }

        .subheadline {
            font-size: 22px;
            color: rgba(255, 255, 255, 0.75);
            max-width: 80%;
        }

        /* CTA */
        .cta-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .cta-button {
            background: {
                    {
                    accent_color|default('#f97316')
                }
            }

            ;
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            padding: 20px 48px;
            border-radius: 16px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .cta-arrow {
            font-size: 24px;
        }

        .terms {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body>
    <div class="template-wrapper">
        <div class="blob-1"></div>
        <div class="blob-2"></div>

        <div class="content">
            <!-- Logo -->
            {% if logo_url %}
            <img src="{{ logo_url }}" alt="Logo" class="logo">
            {% else %}
            <div></div>
            {% endif %}

            <!-- Main content -->
            <div class="main-content">
                <!-- Festival badge -->
                {% if festival %}
                <div class="festival-badge">
                    <span class="festival-emoji">{{ festival_emoji|default('🎉') }}</span>
                    <span>{{ festival }} Sale</span>
                </div>
                {% endif %}

                <h1 class="headline">{{ headline }}</h1>

                {% if subheadline %}
                <p class="subheadline">{{ subheadline }}</p>
                {% endif %}
            </div>

            <!-- CTA section -->
            <div class="cta-section">
                <a href="#" class="cta-button">
                    <span>{{ cta }}</span>
                    <span class="cta-arrow">→</span>
                </a>
                {% if terms %}
                <p class="terms">{{ terms }}</p>
                {% endif %}
            </div>
        </div>
    </div>
</body>

</html>
