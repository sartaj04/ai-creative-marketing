<!DOCTYPE html>
<html>

<head>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .template-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* Background */
        .bg-gradient {
            position: absolute;
            inset: 0;

            background: linear-gradient(135deg, {
                    {
                    bg_color_1|default('#1a1a2e')
                }
            }

            0%, {
                {
                bg_color_2|default('#16213e')
            }
        }

        100%);
        }

        /* Content */
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            padding: 60px;
        }

        /* Logo */
        .logo {
            width: 80px;
            height: auto;
            object-fit: contain;
        }

        /* Text content */
        .text-section {
            max-width: 80%;
        }

        .headline {
            font-size: 56px;
            font-weight: 800;
            line-height: 1.1;

            color: {
                    {
                    text_color|default('#ffffff')
                }
            }

            ;
            margin-bottom: 24px;
        }

        .subheadline {
            font-size: 24px;
            font-weight: 400;

            color: {
                    {
                    text_color|default('#ffffff')
                }
            }

            ;
            opacity: 0.85;
            margin-bottom: 32px;
        }

        /* CTA Button */
        .cta-button {
            display: inline-block;

            background: {
                    {
                    cta_color|default('#f97316')
                }
            }

            ;
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            padding: 16px 32px;
            border-radius: 12px;
            text-decoration: none;
        }

        /* Product image */
        .product-image {
            position: absolute;
            right: 40px;
            bottom: 40px;
            width: 400px;
            height: 400px;
            object-fit: contain;
            filter: drop-shadow(0 25px 50px rgba(0, 0, 0, 0.3));
        }

        /* Discount badge */
        .discount-badge {
            position: absolute;
            top: 40px;
            right: 40px;

            background: {
                    {
                    accent_color|default('#ef4444')
                }
            }

            ;
            color: #ffffff;
            font-size: 24px;
            font-weight: 800;
            padding: 16px 24px;
            border-radius: 16px;
            transform: rotate(5deg);
        }
    </style>
</head>

<body>
    <div class="template-wrapper">
        <div class="bg-gradient"></div>

        <div class="content">
            <!-- Logo -->
            {% if logo_url %}
            <img src="{{ logo_url }}" alt="Logo" class="logo">
            {% endif %}

            <!-- Text section -->
            <div class="text-section">
                <h1 class="headline">{{ headline }}</h1>
                {% if subheadline %}
                <p class="subheadline">{{ subheadline }}</p>
                {% endif %}
                <a href="#" class="cta-button">{{ cta }}</a>
            </div>

            <!-- Product image -->
            {% if product_image %}
            <img src="{{ product_image }}" alt="Product" class="product-image">
            {% endif %}

            <!-- Discount badge -->
            {% if discount %}
            <div class="discount-badge">{{ discount }}% OFF</div>
            {% endif %}
        </div>
    </div>
</body>

</html>
