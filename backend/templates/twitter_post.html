<!DOCTYPE html>
<html>

<head>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .template-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;

            background: {
                    {
                    bg_color|default('#15202b')
                }
            }

            ;
        }

        /* Content */
        .content {
            height: 100%;
            padding: 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
        }

        .brand-info {
            display: flex;
            flex-direction: column;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
        }

        .brand-handle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
        }

        /* Tweet content */
        .tweet-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .tweet-text {
            font-size: 24px;
            line-height: 1.4;
            color: #ffffff;
            margin-bottom: 16px;
        }

        .hashtags {
            font-size: 18px;

            color: {
                    {
                    accent_color|default('#1da1f2')
                }
            }

            ;
        }

        /* Stats */
        .tweet-stats {
            display: flex;
            gap: 24px;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }

        .stat-icon {
            font-size: 18px;
        }

        /* CTA */
        .cta-button {
            background: {
                    {
                    accent_color|default('#1da1f2')
                }
            }

            ;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            padding: 16px 32px;
            border-radius: 100px;
            text-decoration: none;
            text-align: center;
            margin-top: 24px;
        }
    </style>
</head>

<body>
    <div class="template-wrapper">
        <div class="content">
            <!-- Header -->
            <div class="header">
                <div class="brand-section">
                    {% if logo_url %}
                    <img src="{{ logo_url }}" alt="Logo" class="logo">
                    {% endif %}
                    <div class="brand-info">
                        <span class="brand-name">{{ brand_name }}</span>
                        <span class="brand-handle">@{{ handle|default('brand') }}</span>
                    </div>
                </div>
            </div>

            <!-- Tweet content -->
            <div class="tweet-content">
                <p class="tweet-text">{{ body }}</p>
                {% if hashtags %}
                <p class="hashtags">{{ hashtags|join(' ') }}</p>
                {% endif %}
            </div>

            <!-- CTA -->
            {% if cta %}
            <a href="#" class="cta-button">{{ cta }}</a>
            {% endif %}
        </div>
    </div>
</body>

</html>
